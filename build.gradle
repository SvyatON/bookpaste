def sharedJava = rootProject.layout.projectDirectory.dir("src/main/java").asFile
def sharedResources = rootProject.layout.projectDirectory.dir("src/main/resources").asFile

tasks.register("exportBuildSources", Exec) {
	workingDir = rootProject.projectDir
	commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
		rootProject.file("tools/export-build-sources.ps1").absolutePath,
		"-ProjectRoot", rootProject.projectDir.absolutePath
}

subprojects {
	repositories {
		mavenCentral()
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		maven {
			name = "Terraformers"
			url = "https://maven.terraformersmc.com/"
		}
		maven {
			name = "Nucleoid"
			url = "https://maven.nucleoid.xyz/"
		}
	}
}

versionTargets.each { moduleName, cfg ->
	project(":${moduleName}") {
		apply plugin: cfg.unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
		apply plugin: 'maven-publish'

		version = "${rootProject.mod_version}+${cfg.versionSuffix}"
		group = rootProject.maven_group

		base {
			archivesName = rootProject.archives_base_name
		}

		sourceSets {
			main {
				java {
					srcDirs = cfg.standaloneSources ? [
						project.layout.projectDirectory.dir("src/main/java").asFile
					] : [
						project.layout.projectDirectory.dir("src/main/java").asFile,
						sharedJava
					]
				}
				resources {
					srcDirs = cfg.standaloneSources ? [
						project.layout.projectDirectory.dir("src/main/resources").asFile
					] : [
						project.layout.projectDirectory.dir("src/main/resources").asFile,
						sharedResources
					]
				}
			}
		}

		if (moduleName in ["mc1161", "mc1165", "mc1171", "mc1181", "mc1182", "mc1192", "mc1193", "mc1194", "mc1201", "mc1204", "mc1206", "mc1214"]) {
			sourceSets.main.java.exclude("ru/svyaton/bookpaste/mixin/BookEditScreenModernMixin.java")
		}

		if (moduleName in ["mc1214", "mc1218", "mc12110", "mc12111"]) {
			sourceSets.main.java.exclude("ru/svyaton/bookpaste/BookPasteBookLimits.java")
		}

		dependencies {
			minecraft "com.mojang:minecraft:${cfg.minecraftVersion}"
			if (!cfg.unobfuscated) {
				mappings "net.fabricmc:yarn:${cfg.yarnMappings}:v2"
				modImplementation "net.fabricmc:fabric-loader:${cfg.loaderVersion ?: rootProject.loader_version}"
				modImplementation "net.fabricmc.fabric-api:fabric-api:${cfg.fabricApiVersion}"
				modCompileOnly "com.terraformersmc:modmenu:${cfg.modmenuVersion}"
			} else {
				implementation "net.fabricmc:fabric-loader:${cfg.loaderVersion ?: rootProject.loader_version}"
				implementation "net.fabricmc.fabric-api:fabric-api:${cfg.fabricApiVersion}"
				compileOnly "com.terraformersmc:modmenu:${cfg.modmenuVersion}"
			}
		}

		tasks.withType(JavaCompile).configureEach {
			it.options.release = cfg.releaseVersion ?: cfg.javaVersion
			it.options.encoding = "UTF-8"
		}

		tasks.named("compileJava", JavaCompile) {
			if (!cfg.standaloneSources && moduleName in ["mc1201", "mc1204", "mc1206", "mc1214", "mc1218", "mc12110", "mc12111"]) {
				it.source = files(
					project.layout.projectDirectory.dir("src/main/java").asFile,
					fileTree(sharedJava) {
						exclude "ru/svyaton/bookpaste/PasteHelper.java"
						if (moduleName in ["mc1214", "mc1218", "mc12110", "mc12111"]) {
							exclude "ru/svyaton/bookpaste/BookPasteBookLimits.java"
						}
						if (moduleName in ["mc1201", "mc1204", "mc1206", "mc1214"]) {
							exclude "ru/svyaton/bookpaste/mixin/BookEditScreenModernMixin.java"
						}
					}
				)
			}
		}

		java {
			toolchain.languageVersion = JavaLanguageVersion.of(cfg.toolchainVersion ?: cfg.javaVersion)
			withSourcesJar()
		}

		processResources {
			inputs.property "version", project.version
			inputs.property "minecraft_dependency", cfg.minecraftDependency
			inputs.property "java_dependency", cfg.javaDependency
			duplicatesStrategy = DuplicatesStrategy.EXCLUDE

			filesMatching("fabric.mod.json") {
				expand(
					version: project.version,
					minecraft_dependency: cfg.minecraftDependency,
					java_dependency: cfg.javaDependency
				)
			}
		}

		jar {
			from(rootProject.file("LICENSE"))
			from(moduleName in ["mc1214", "mc1218", "mc12110", "mc12111"] ? project.file("NOTICE") : rootProject.file("NOTICE"))
			duplicatesStrategy = DuplicatesStrategy.EXCLUDE
		}

		tasks.named("sourcesJar") {
			duplicatesStrategy = DuplicatesStrategy.EXCLUDE
		}

		tasks.named("assemble") {
			dependsOn rootProject.tasks.named("exportBuildSources")
		}

		tasks.named("build") {
			dependsOn rootProject.tasks.named("exportBuildSources")
		}

		if (cfg.unobfuscated) {
			tasks.named("jar") {
				destinationDirectory = rootProject.layout.buildDirectory.dir("libs").get().asFile
			}

			tasks.named("sourcesJar") {
				destinationDirectory = rootProject.layout.buildDirectory.dir("libs").get().asFile
			}
		} else {
			tasks.named("remapJar") {
				destinationDirectory = rootProject.layout.buildDirectory.dir("libs").get().asFile
			}

			tasks.named("remapSourcesJar") {
				destinationDirectory = rootProject.layout.buildDirectory.dir("libs").get().asFile
			}
		}
	}
}

tasks.named("assemble") {
	dependsOn(versionTargets.keySet().collect { ":${it}:assemble" })
}

tasks.named("build") {
	dependsOn(versionTargets.keySet().collect { ":${it}:build" })
}
